# Fork-only workflow (djbclark/bottom): checks and builds the middle-truncation branch.
# Not part of upstream; keep it out of any upstream PR.

name: fork build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - middle-truncate-command

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: fmt, clippy, test (linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  build-macos:
    name: release build (macOS arm64)
    runs-on: macos-15
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/btm dist/btm
          cd dist && tar czf btm-macos-arm64.tar.gz btm
      - uses: actions/upload-artifact@v4
        with:
          name: btm-macos-arm64
          path: dist/btm-macos-arm64.tar.gz
