name: rolling average validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  BTM_GENERATE: "1"
  CARGO_HUSKY_DONT_INSTALL_HOOKS: true
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  COMPLETION_DIR: target/generated/completion
  MANPAGE_DIR: target/generated/man
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked
      - name: Check generated help, manual, and completions
        run: |
          target/debug/btm --help > target/generated/help.txt
          target/debug/btm --average 5s --help > /dev/null
          target/debug/btm --average 5m --help > /dev/null
          target/debug/btm --average 34h --help > /dev/null
          python3 - <<'CHECK'
          from pathlib import Path
          assert '--average' in Path('target/generated/help.txt').read_text()
          assert any('--average' in p.read_text() for p in Path('target/generated/man').glob('*'))
          assert any('--average' in p.read_text() for p in Path('target/generated/completion').glob('*'))
          CHECK
      - name: Exercise live TUI duration editor
        run: python3 .github/ci/averaging_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: averaging-linux
          path: |
            target/debug/btm
            target/generated/
